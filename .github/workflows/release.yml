name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        shell: cmd
        run: npm.cmd install -g npm@latest

      - name: Validate package
        shell: cmd
        run: |
          node --check index.js
          npm.cmd pack --dry-run

      # Bootstrap release: the package does not exist yet, so the first publish
      # uses a one-time granular token stored as the NPM_TOKEN secret.
      # After the package exists and its Trusted Publisher is configured,
      # remove this env block and restore `npm.cmd publish --access public --provenance`.
      - name: Publish to npm
        shell: cmd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm.cmd publish --access public
